[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
solc = "0.8.24"
remappings = ["openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/"]

optimizer = true
optimizer_runs = 200

[rpc_endpoints]

base = "https://mainnet.base.org"
baseSepolia = "https://sepolia.base.org"
